<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Awakening Overlay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: #ffffff;
      width: 100vw;
      height: 100vh;
    }

    .team {
      position: fixed;
      top: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px;
    }
    .team-left  { left: 0; }
    .team-right { right: 0; }

    /* ══════════════════════════════════════════
       PLAYER ROW — parallelogram cyberpunk panel
       Left team:  top is full-width, bottom-right slants inward  →  \
       Right team: mirror                                          →  /
       ══════════════════════════════════════════ */
    .player-row {
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: visible;

      /* Parallelogram: right end slants backward at bottom (left team) */
      clip-path: polygon(0 0, 100% 0, calc(100% - 64px) 100%, 0 100%);

      /* ── Multi-band dark steel ──
         Real metal has multiple tonal bands — bright edge, dark body,
         mid highlight, deep shadow, brighter band, dark again, bright edge.
         We also overlay a diagonal brushed-grain texture. */
      background:
        /* Diagonal brush lines — 78° mimics milled aluminium */
        repeating-linear-gradient(
          78deg,
          transparent            0px,
          transparent            12px,
          rgba(255,255,255,0.020) 12px,
          rgba(255,255,255,0.020) 16px
        ),
        /* Tonal metal bands — vary brightness, add subtle blue-steel tint */
        linear-gradient(
          180deg,
          #58718e  0%,      /* top specular — bright steel-blue edge */
          #1d2b3a  3%,      /* quick drop into dark */
          #111926  12%,     /* deep steel body */
          #1a2535  26%,     /* first mid band — slightly warmer */
          #0c1520  44%,     /* deepest shadow — cold blue-black */
          #162030  57%,     /* second band lift */
          #1f3042  70%,     /* lighter steel — distinct from above */
          #101820  84%,     /* shadow again */
          #263848  92%,     /* pre-edge lift */
          #4a6070  100%     /* bottom specular edge */
        );

      /* LED glow follows the clip-path parallelogram shape */
      filter:
        drop-shadow(0 0 28px rgba(0, 150, 255, 0.55))
        drop-shadow(0 0 8px  rgba(0, 210, 255, 0.80))
        drop-shadow(0 0 72px rgba(0, 110, 230, 0.20));
    }

    /* Right team: mirror clip + red LED */
    .team-right .player-row {
      clip-path: polygon(64px 0, 100% 0, 100% 100%, 0 100%);
      filter:
        drop-shadow(0 0 28px rgba(230, 40,  40,  0.60))
        drop-shadow(0 0 8px  rgba(255, 90,  90,  0.85))
        drop-shadow(0 0 72px rgba(180, 20,  20,  0.22));
    }

    /* ── Top section: portrait + gear + awakening slots ── */
    .player-top {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 80px 8px 16px; /* right pad clears the clip-path slant */
    }
    .team-right .player-top {
      flex-direction: row-reverse;
      padding: 12px 16px 8px 80px; /* left pad clears the clip-path slant */
    }

    /* ── Nameplate bar — its own distinct element ── */
    .nameplate {
      display: flex;
      align-items: center;
      padding: 8px 88px 12px 24px; /* right pad: leave room for the slanted cut */
      gap: 20px;
      position: relative;

      /* Darker recessed plate — clearly different from the steel body */
      background:
        linear-gradient(
          180deg,
          #06090e  0%,
          #0c1420  50%,
          #080d16  100%
        );

      /* Top accent line — the LED strip separating plate from body */
      border-top: 4px solid rgba(30, 140, 255, 0.75);
      box-shadow: inset 0 8px 16px rgba(0, 0, 0, 0.70);
    }
    .team-right .nameplate {
      flex-direction: row-reverse;
      padding: 8px 24px 12px 88px;
      border-top-color: rgba(230, 50, 50, 0.80);
      text-align: right;
    }

    /* Nameplate accent pip — small coloured square before the name */
    .nameplate::before {
      content: '';
      display: block;
      width: 12px;
      height: 36px;
      flex-shrink: 0;
      background: rgba(60, 160, 255, 0.90);
      box-shadow: 0 0 20px rgba(60, 160, 255, 0.80);
    }
    .team-right .nameplate::before {
      background: rgba(240, 70, 70, 0.90);
      box-shadow: 0 0 20px rgba(240, 70, 70, 0.80);
    }

    .ign-text {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 5.6px;
      text-transform: uppercase;
      color: #b8d4f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow:
        0 0 24px rgba(60, 160, 255, 0.75),
        0 0 8px  rgba(0, 100, 220, 0.50);
    }
    .team-right .ign-text {
      color: #f0c0c0;
      text-shadow:
        0 0 24px rgba(240, 80, 80, 0.75),
        0 0 8px  rgba(180, 30, 30, 0.55);
    }

    /* ── Char portrait ── */
    .char-and-gear {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }

    .char-box {
      width: 104px;
      height: 104px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;

      /* Beveled inset box — bright top/left, dark bottom/right */
      background: #080c14;
      border-top:    4px solid rgba(90, 160, 230, 0.80);
      border-left:   4px solid rgba(70, 130, 200, 0.65);
      border-right:  4px solid rgba(10,  25,  50, 0.90);
      border-bottom: 4px solid rgba(10,  20,  45, 0.95);
      box-shadow:
        inset 4px  4px  0 rgba(100, 180, 255, 0.12),
        inset -4px -4px 0 rgba(0, 0, 0, 0.50),
        inset 0 0 32px rgba(0, 0, 0, 0.60);
    }
    .team-right .char-box {
      border-top-color:    rgba(220,  90,  90, 0.80);
      border-left-color:   rgba(180,  60,  60, 0.65);
      border-right-color:  rgba( 50,  10,  10, 0.90);
      border-bottom-color: rgba( 45,  10,  10, 0.95);
      box-shadow:
        inset 4px  4px  0 rgba(255, 120, 120, 0.10),
        inset -4px -4px 0 rgba(0, 0, 0, 0.50),
        inset 0 0 32px rgba(0, 0, 0, 0.60);
    }

    .char-icon {
      width: 96px;
      height: 96px;
      object-fit: cover;
      display: block;
    }
    .char-fallback {
      font-size: 24px;
      color: #fff;
      text-align: center;
      padding: 4px;
      line-height: 1.1;
      word-break: break-word;
      text-shadow: 0 0 8px #000;
    }

    /* ── Gear box ── */
    .gear-box {
      width: 52px;
      height: 52px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      background: #060910;
      border-top:    4px solid rgba(70, 130, 200, 0.70);
      border-left:   4px solid rgba(50, 100, 170, 0.55);
      border-right:  4px solid rgba(10,  20,  45, 0.90);
      border-bottom: 4px solid rgba(10,  18,  40, 0.95);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.65);
    }
    .team-right .gear-box {
      border-top-color:    rgba(200, 70, 70, 0.70);
      border-left-color:   rgba(160, 50, 50, 0.55);
      border-right-color:  rgba( 45, 10, 10, 0.90);
      border-bottom-color: rgba( 40,  8,  8, 0.95);
    }
    .gear-icon {
      width: 44px;
      height: 44px;
      object-fit: cover;
      display: block;
    }
    .gear-fallback {
      font-size: 20px;
      color: #fff;
      text-align: center;
      padding: 4px;
      line-height: 1.1;
      word-break: break-word;
      text-shadow: 0 0 8px #000;
    }

    /* ── Awakening slots ── */
    .awakenings {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 472px;
      flex-shrink: 0;
    }
    .team-right .awakenings {
      flex-direction: row-reverse;
    }

    /* Filled awk cell — recessed machined pocket */
    .awk-box {
      width: 88px;
      height: 88px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;

      /* Darker than the panel, with a distinct bevel */
      background:
        linear-gradient(
          160deg,
          #141e2c 0%,
          #080e18 55%,
          #101828 100%
        );
      border-top:    4px solid rgba(70, 140, 220, 0.70);
      border-left:   4px solid rgba(50, 110, 180, 0.55);
      border-right:  4px solid rgba( 8,  18,  45, 0.90);
      border-bottom: 4px solid rgba( 8,  16,  40, 0.95);
      box-shadow:
        inset 4px  4px  0 rgba(90, 170, 255, 0.10),
        inset -4px -4px 0 rgba(0, 0, 0, 0.60),
        inset 0 0 32px rgba(0, 0, 0, 0.50);
    }
    .team-right .awk-box {
      border-top-color:    rgba(210,  70,  70, 0.70);
      border-left-color:   rgba(170,  50,  50, 0.55);
      border-right-color:  rgba( 40,   8,   8, 0.90);
      border-bottom-color: rgba( 35,   6,   6, 0.95);
      box-shadow:
        inset 4px  4px  0 rgba(255, 110, 110, 0.08),
        inset -4px -4px 0 rgba(0, 0, 0, 0.60),
        inset 0 0 32px rgba(0, 0, 0, 0.50);
    }

    /* Starting awakening — bright white glow, neutral on both teams */
    .awk-box.starting {
      border-top-color:    rgba(220, 230, 255, 0.95) !important;
      border-left-color:   rgba(190, 205, 240, 0.80) !important;
      border-right-color:  rgba( 60,  70, 100, 0.90) !important;
      border-bottom-color: rgba( 50,  60,  90, 0.95) !important;
      box-shadow:
        0 0 32px rgba(200, 220, 255, 0.70),
        0 0 8px  rgba(240, 245, 255, 0.95),
        inset 4px 4px 0 rgba(255, 255, 255, 0.15),
        inset 0 0 40px rgba(0, 0, 0, 0.50) !important;
    }

    .awk-icon {
      width: 72px;
      height: 72px;
      object-fit: cover;
      display: block;
    }
    .awk-fallback {
      font-size: 20px;
      color: #ffffff;
      text-align: center;
      padding: 4px;
      line-height: 1.1;
      word-break: break-word;
      text-shadow: 0 0 8px #000;
    }

    /* Empty slot — invisible spacer, same footprint as awk-box */
    .awk-empty {
      width: 88px;
      height: 88px;
      flex-shrink: 0;
    }

    /* ── Glow pulse animations ── */
    @keyframes glow-pulse-blue {
      0%   { box-shadow: 0 0 48px 20px rgba(0, 170, 255, 0.95), inset 0 0 32px rgba(0,0,0,0.5); }
      60%  { box-shadow: 0 0 28px 8px  rgba(0, 150, 255, 0.45), inset 0 0 32px rgba(0,0,0,0.5); }
      100% { box-shadow: inset 4px 4px 0 rgba(90,170,255,0.10), inset -4px -4px 0 rgba(0,0,0,0.60), inset 0 0 32px rgba(0,0,0,0.50); }
    }
    @keyframes glow-pulse-red-team {
      0%   { box-shadow: 0 0 48px 20px rgba(255, 80,  80,  0.95), inset 0 0 32px rgba(0,0,0,0.5); }
      60%  { box-shadow: 0 0 28px 8px  rgba(255, 60,  60,  0.45), inset 0 0 32px rgba(0,0,0,0.5); }
      100% { box-shadow: inset 4px 4px 0 rgba(255,110,110,0.08), inset -4px -4px 0 rgba(0,0,0,0.60), inset 0 0 32px rgba(0,0,0,0.50); }
    }
    @keyframes glow-pulse-starting {
      0%   { box-shadow: 0 0 56px 24px rgba(220, 235, 255, 1.00), inset 0 0 40px rgba(0,0,0,0.5); }
      60%  { box-shadow: 0 0 32px 12px rgba(200, 220, 255, 0.55), inset 0 0 40px rgba(0,0,0,0.5); }
      100% { box-shadow: 0 0 32px rgba(200,220,255,0.70), 0 0 8px rgba(240,245,255,0.95), inset 4px 4px 0 rgba(255,255,255,0.15), inset 0 0 40px rgba(0,0,0,0.50); }
    }

    .awk-box.new-pulse           { animation: glow-pulse-blue     600ms ease-out forwards; }
    .team-right .awk-box.new-pulse { animation: glow-pulse-red-team 600ms ease-out forwards; }
    /* Starting always uses the intense red pulse, overriding team colour */
    .awk-box.starting.new-pulse,
    .team-right .awk-box.starting.new-pulse {
      animation: glow-pulse-starting 600ms ease-out forwards;
    }

    #waiting-msg {
      position: fixed;
      top: 24px;
      left: 24px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 40px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #6aacdf;
      text-shadow: 0 0 32px rgba(0, 150, 255, 0.80), 0 0 8px #000;
    }
  </style>
</head>
<body>
  <div id="waiting-msg">Waiting for game data...</div>
  <div id="team-left"  class="team team-left"></div>
  <div id="team-right" class="team team-right"></div>

  <script>
    const API_URL = '/api/state';
    let lastGameCount = -1;
    let prevPlayers = null;

    function makeImg(src, imgClass, altText, fallbackClass) {
      const img = document.createElement('img');
      img.src = src;
      img.className = imgClass;
      img.alt = altText;
      img.title = altText;
      img.onerror = function () {
        const span = document.createElement('span');
        span.className = fallbackClass;
        span.textContent = altText;
        img.replaceWith(span);
      };
      return img;
    }

    function buildRow(player) {
      const row = document.createElement('div');
      row.className = 'player-row';

      // ── Top section: portrait + gear + awakening slots ──
      const topSection = document.createElement('div');
      topSection.className = 'player-top';

      // Character portrait + gear icon
      const charAndGear = document.createElement('div');
      charAndGear.className = 'char-and-gear';

      const charBox = document.createElement('div');
      charBox.className = 'char-box';
      charBox.appendChild(makeImg(
        '/img/char/' + encodeURIComponent(player.character),
        'char-icon', player.character, 'char-fallback'
      ));
      charAndGear.appendChild(charBox);

      const gearBox = document.createElement('div');
      gearBox.className = 'gear-box';
      const gear = player.awakenings[0];
      if (gear) {
        gearBox.appendChild(makeImg(
          '/img/awk/' + encodeURIComponent(gear),
          'gear-icon', gear, 'gear-fallback'
        ));
      }
      charAndGear.appendChild(gearBox);
      topSection.appendChild(charAndGear);

      // Awakening slots (indices 1–5, 0 is gear)
      const awkContainer = document.createElement('div');
      awkContainer.className = 'awakenings';

      for (let i = 0; i < 5; i++) {
        const awk = player.awakenings[i + 1];
        if (awk) {
          const box = document.createElement('div');
          let cls = 'awk-box' + (i === 0 ? ' starting' : '');
          if (prevPlayers !== null) {
            const prev = prevPlayers.find(p => p.ign === player.ign);
            const wasEmpty = !prev || !prev.awakenings[i + 1];
            if (wasEmpty) cls += ' new-pulse';
          }
          box.className = cls;
          box.appendChild(makeImg(
            '/img/awk/' + encodeURIComponent(awk),
            'awk-icon', awk, 'awk-fallback'
          ));
          awkContainer.appendChild(box);
        } else {
          const empty = document.createElement('div');
          empty.className = 'awk-empty';
          awkContainer.appendChild(empty);
        }
      }

      topSection.appendChild(awkContainer);
      row.appendChild(topSection);

      // ── Nameplate — its own distinct bar ──
      const nameplate = document.createElement('div');
      nameplate.className = 'nameplate';
      const ignText = document.createElement('span');
      ignText.className = 'ign-text';
      ignText.textContent = player.ign;
      nameplate.appendChild(ignText);
      row.appendChild(nameplate);

      return row;
    }

    function render(players) {
      const waiting   = document.getElementById('waiting-msg');
      const teamLeft  = document.getElementById('team-left');
      const teamRight = document.getElementById('team-right');

      teamLeft.innerHTML  = '';
      teamRight.innerHTML = '';

      if (!players || players.length === 0) {
        waiting.style.display = 'block';
        prevPlayers = null;
        return;
      }

      waiting.style.display = 'none';

      const team1 = players.filter(p => p.team === 1);
      const team2 = players.filter(p => p.team === 2);
      // Only use team split when every player is accounted for on one of the two sides.
      // Partial data (e.g. roster cleared mid-game, or username mismatch) would cause
      // some players to be silently dropped, so fall back to arrival order in that case.
      if (team1.length + team2.length === players.length && team1.length > 0 && team2.length > 0) {
        team1.forEach(p => teamLeft.appendChild(buildRow(p)));
        team2.forEach(p => teamRight.appendChild(buildRow(p)));
      } else {
        // Fallback: no complete team data yet, split by arrival order
        players.slice(0, 3).forEach(p => teamLeft.appendChild(buildRow(p)));
        players.slice(3, 6).forEach(p => teamRight.appendChild(buildRow(p)));
      }

      prevPlayers = players;
    }

    async function poll() {
      try {
        const resp = await fetch(API_URL);
        if (!resp.ok) return;
        const data = await resp.json();
        if (data.game_count !== lastGameCount) {
          lastGameCount = data.game_count;
          render(data.players);
        }
      } catch (_) {}
    }

    poll();
    setInterval(poll, 1500);
  </script>
</body>
</html>
